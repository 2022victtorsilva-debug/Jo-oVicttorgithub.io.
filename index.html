      const addToCart = (product) => {

        setCart(prev => {

          const exists = prev.find(item => item.id === product.id);

          if (exists) {

            return prev.map(item =>
              item.id === product.id
                ? {
                    ...item,
                    quantity: item.quantity + 1
                  }
                : item
            );

          }

          return [
            ...prev,
            {
              ...product,
              quantity: 1
            }
          ];

        });

        setIsCartOpen(true);
      };


      /* Atualizar quantidade */

      const updateQuantity = (id, delta) => {

        setCart(prev => {

          return prev
            .map(item => {

              if (item.id === id) {

                return {
                  ...item,
                  quantity: item.quantity + delta
                };

              }

              return item;

            })
            .filter(item => item.quantity > 0);

        });

      };

        0
      );

                      Empatia, qualidade, diversidade, transparência e compromisso.
                    </p>

                  </div>

                </div>


                {/* CEO */}

                <div className="bg-white rounded-[2.5rem] p-8 sm:p-14 border border-rose-100 shadow-sm">

                  <div className="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-10 items-center">

                    <div className="text-center">

                      <img
                        src="https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=400&q=80"
                        alt="Foto ilustrativa do Fundador"
                        className="w-48 h-48 sm:w-56 sm:h-56 rounded-full object-cover mx-auto shadow-lg border-4 border-white"
                      />

                      <span className="text-[10px] uppercase text-gray-400 mt-3 block font-bold tracking-wider">
                        Imagem Ilustrativa
                      </span>

                    </div>


                    <div className="md:col-span-2 space-y-5 text-center md:text-left">

                      <span className="text-xs font-bold uppercase tracking-widest text-rose-600 bg-rose-50 px-3 py-1 rounded-full">
                        Liderança
                      </span>

                      <h2 className="font-serif text-3xl sm:text-4xl font-bold text-gray-900">
                        Gabriel Silva <span className="text-lg font-normal text-gray-500">(Fictício)</span>
                      </h2>

                      <p className="text-rose-600 font-bold text-sm tracking-wide uppercase">
                        Fundador e Diretor Criativo
                      </p>

                      <p className="text-gray-700 text-lg leading-relaxed italic">
                        "Acredito que os melhores presentes não são apenas objetos, mas sim pontes que conectam corações."
                      </p>

                    </div>

                  </div>

                </div>

              </div>

            )}


            {/* ===================================================
                COLEÇÃO
            =================================================== */}

            {currentPath === '/servicos' && (

              <div className="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-12 pb-24">

                <div className="text-center space-y-4">

                  <h1 className="font-serif text-4xl sm:text-5xl font-bold text-gray-900">
                    Nossa Coleção Completa
                  </h1>

                  <p className="text-gray-600 text-lg">
                    Presentes de alta qualidade embalados com amor.
                  </p>

                </div>


                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

                  {PRODUCTS.map(p => (

                    <div
                      key={p.id}
                      className="bg-white rounded-3xl border border-rose-50 overflow-hidden shadow-sm hover:shadow-xl transition-shadow duration-300 flex flex-col justify-between group"
                    >

                      <div className="relative aspect-square overflow-hidden bg-gray-50">

                        <img
                          src={p.image}
                          alt={`Foto de ${p.title}`}
                          className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
                          loading="lazy"
                          onError={(e) => {
                            e.target.src = 'https://via.placeholder.com/400x400?text=Produto+Demo';
                          }}
                        />

                        {p.badge && (

                          <span className={`absolute top-4 right-4 text-white text-xs font-bold px-3 py-1.5 rounded-full shadow-sm ${p.badgeColor}`}>
                            {p.badge}
                          </span>

                        )}

                      </div>


                      <div className="p-6 space-y-3 flex-grow">

                        <h3 className="font-serif text-xl font-bold text-gray-900 leading-tight">
                          {p.title}
                        </h3>

                        <p className="text-gray-600 text-sm leading-relaxed">
                          {p.description}
                        </p>

                      </div>


                      <div className="p-6 pt-0 flex justify-between items-center border-t border-rose-50 mt-4">

                        <span className="text-2xl font-bold text-rose-600">
                          R$ {p.price.toFixed(2).replace('.', ',')}
                        </span>

                        <button
                          onClick={() => addToCart(p)}
                          className="bg-gray-900 hover:bg-rose-600 text-white px-5 py-2.5 rounded-xl font-bold transition-colors"
                        >
                          + Adicionar
                        </button>

                      </div>

                    </div>

                  ))}

                </div>

              </div>

            )}


            {/* ===================================================
                GALERIA
            =================================================== */}

            {currentPath === '/galeria' && (

              <div className="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-12 pb-24">

                <div className="text-center space-y-4">

                  <h1 className="font-serif text-4xl sm:text-5xl font-bold text-gray-900">
                    Galeria de Momentos
                  </h1>

                  <p className="text-gray-600 text-lg">
                    Histórias reais, sorrisos sinceros e a materialização do amor.
                  </p>

                </div>


                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">

                  {GALLERY_IMAGES.map(img => (

                    <div
                      key={img.id}
                      className="group aspect-square rounded-3xl overflow-hidden shadow-sm relative bg-rose-50 border border-rose-100 cursor-pointer"
                    >

                      <img
                        src={img.url}
                        alt={`Galeria: ${img.title}`}
                        className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700"
                        loading="lazy"
                        onError={(e) => {
                          e.target.src = 'https://via.placeholder.com/400x400?text=Imagem+Galeria';
                        }}
                      />

                      <div className="absolute inset-0 bg-gradient-to-t from-gray-900/80 via-gray-900/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-6">

                        <span className="text-white font-serif font-bold text-xl tracking-wide">
                          {img.title}
                        </span>

                      </div>

                    </div>

                  ))}

                </div>

              </div>

            )}


            {/* ===================================================
                CONTATO
            =================================================== */}

            {currentPath === '/contato' && (

              <div className="py-16 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 space-y-12 pb-24">

                <div className="text-center space-y-4">

                  <h1 className="font-serif text-4xl sm:text-5xl font-bold text-gray-900">
                    Fale Conosco
                  </h1>

                  <p className="text-gray-600 text-lg max-w-2xl mx-auto">
                    Estamos aqui para tirar dúvidas sobre os produtos.
                  </p>

                </div>


                <div className="grid grid-cols-1 lg:grid-cols-3 gap-10">

                  <div className="space-y-6 lg:col-span-1">

                    <a
                      href={whatsappUrl}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="block p-8 bg-emerald-50 rounded-3xl border border-emerald-100 text-emerald-900 hover:bg-emerald-100 transition-all"
                    >

                      <h3 className="font-serif font-bold text-xl mb-1">
                        WhatsApp (Demo)
                      </h3>

                      <p className="text-sm text-emerald-700 font-medium">
                        Atendimento rápido por mensagem
                      </p>

                    </a>


                    <a
                      href={DEMO_CONFIG.instagramUrl}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="block p-8 bg-rose-50 rounded-3xl border border-rose-100 text-rose-900 hover:bg-rose-100 transition-all"
                    >

                      <h3 className="font-serif font-bold text-xl mb-1">
                        Instagram (Demo)
                      </h3>

                      <p className="text-sm text-rose-700 font-medium">
                        Siga nossas novidades no perfil
                      </p>

                    </a>

                  </div>


                  <div className="lg:col-span-2 bg-white p-8 sm:p-12 rounded-3xl border border-rose-100 shadow-sm">

                    <h2 className="font-serif text-2xl font-bold text-gray-900">
                      Envie uma mensagem
                    </h2>

                    <p className="text-gray-500 text-sm mt-1 mb-8">
                      *(Simulação de formulário para portfólio)
                    </p>


                    <form
                      className="space-y-6"
                      onSubmit={(e) => {
                        e.preventDefault();
                        alert('Mensagem enviada com sucesso! (Simulação)');
                        e.target.reset();
                      }}
                    >

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">

                        <input
                          type="text"
                          required
                          className="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 text-sm outline-none focus:ring-2 focus:ring-rose-400"
                          placeholder="Seu Nome"
                        />

                        <input
                          type="email"
                          required
                          className="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 text-sm outline-none focus:ring-2 focus:ring-rose-400"
                          placeholder="Seu E-mail"
                        />

                      </div>


                      <textarea
                        rows="5"
                        required
                        className="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 text-sm outline-none focus:ring-2 focus:ring-rose-400 resize-none"
                        placeholder="Como podemos te ajudar?"
                      ></textarea>


                      <button
                        type="submit"
                        className="w-full sm:w-auto bg-rose-600 hover:bg-rose-700 text-white font-bold py-4 px-10 rounded-xl shadow-lg"
                      >
                        Enviar Mensagem
                      </button>

                    </form>

                  </div>

                </div>

              </div>

            )}

          </main>


          {/* =====================================================
              FOOTER
          ===================================================== */}

          <footer className="bg-gray-900 text-gray-300 py-16 border-t border-gray-800">

            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 md:grid-cols-3 gap-12 mb-12 text-center md:text-left">

              <div className="space-y-4">

                <span className="font-serif text-3xl font-bold text-white">
                  Amor<span className="text-rose-500">emPar</span>
                </span>

                <p className="text-sm text-gray-400 leading-relaxed max-w-xs mx-auto md:mx-0">
                  Projeto conceitual desenvolvido para demonstração de portfólio. Nenhuma transação real é realizada.
                </p>

              </div>


              <div>

                <h4 className="font-bold text-white mb-6 uppercase tracking-widest text-sm">
                  Navegação
                </h4>

                <div className="flex flex-col space-y-3 text-sm font-medium">

                  {[
                    '/',
                    '/sobre',
                    '/servicos',
                    '/contato'
                  ].map(path => {

                    const labels = {
                      '/': 'Página Inicial',
                      '/sobre': 'Nossa História',
                      '/servicos': 'Catálogo de Presentes',
                      '/contato': 'Fale Conosco'
                    };

                    return (

                      <button
                        key={path}
                        onClick={() => navigate(path)}
                        className="hover:text-rose-400 text-gray-400 transition-colors text-left w-fit mx-auto md:mx-0"
                      >
                        {labels[path]}
                      </button>

                    );

                  })}

                </div>

              </div>


              <div>

                <h4 className="font-bold text-white mb-6 uppercase tracking-widest text-sm">
                  Redes Demo
                </h4>

                <div className="flex justify-center md:justify-start space-x-6">

                  <a
                    href={whatsappUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="text-gray-400 hover:text-emerald-400 font-semibold"
                  >
                    WhatsApp
                  </a>

                  <a
                    href={DEMO_CONFIG.instagramUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="text-gray-400 hover:text-rose-400 font-semibold"
                  >
                    Instagram
                  </a>

                </div>

              </div>

            </div>


            <div className="text-center pt-8 border-t border-gray-800 text-xs text-gray-500 font-medium">

              &copy; 2026 Amor em Par - Todos os direitos reservados.
              Site de demonstração para portfólio.

            </div>

          </footer>


          {/* =====================================================
              CARRINHO
          ===================================================== */}

          {isCartOpen && (

            <div className="fixed inset-0 z-50 flex justify-end">

              <div
                className="absolute inset-0 bg-gray-900/40 backdrop-blur-sm"
                onClick={() => setIsCartOpen(false)}
              ></div>


              <div className="relative w-full max-w-md bg-white h-full flex flex-col shadow-2xl">


                {/* HEADER */}

                <div className="flex justify-between items-center p-6 border-b border-rose-100 bg-rose-50/50">

                  <h3 className="font-serif text-xl font-bold text-gray-900">
                    Seu Carrinho
                  </h3>

                  <button
                    onClick={() => setIsCartOpen(false)}
                    className="text-gray-500 hover:text-gray-900 bg-white p-2 rounded-full shadow-sm"
                  >

                    ✕

                  </button>

                </div>


                {/* ITENS */}

                <div className="flex-1 overflow-y-auto p-6 space-y-6">

                  {cart.length === 0 ? (

                    <div className="text-center py-12">

                      <p className="text-gray-500 font-medium">
                        Seu carrinho está vazio.
                      </p>

                      <button
                        onClick={() => {
                          setIsCartOpen(false);
                          navigate('/servicos');
                        }}
                        className="mt-4 text-sm font-bold text-rose-600 underline"
                      >
                        Ver produtos
                      </button>

                    </div>

                  ) : (

                    cart.map(item => (

                      <div
                        key={item.id}
                        className="flex items-center gap-4 border border-rose-50 p-3 rounded-2xl shadow-sm bg-white"
                      >

                        <img
                          src={item.image}
                          alt={item.title}
                          className="w-20 h-20 object-cover rounded-xl bg-gray-50"
                          onError={(e) => {
                            e.target.src = 'https://via.placeholder.com/100x100?text=Produto';
                          }}
                        />


                        <div className="flex-1 min-w-0">

                          <h4 className="font-bold text-sm text-gray-900 truncate">
                            {item.title}
                          </h4>

                          <span className="font-bold text-rose-600 text-sm block mt-1">
                            R$ {(item.price * item.quantity).toFixed(2).replace('.', ',')}
                          </span>


                          <div className="flex items-center mt-3 bg-gray-50 w-fit rounded-lg border border-gray-200">

                            <button
                              onClick={() => updateQuantity(item.id, -1)}
                              className="w-8 h-8 flex items-center justify-center text-gray-600 hover:text-rose-600 font-bold"
                            >
                              −
                            </button>

                            <span className="text-sm font-bold w-6 text-center">
                              {item.quantity}
                            </span>

                            <button
                              onClick={() => updateQuantity(item.id, 1)}
                              className="w-8 h-8 flex items-center justify-center text-gray-600 hover:text-rose-600 font-bold"
                            >
                              +
                            </button>

                          </div>

                        </div>

                      </div>

                    ))

                  )}

                </div>


                {/* FOOTER */}

                {cart.length > 0 && (

                  <div className="p-6 bg-gray-50 border-t border-gray-100">

                    <div className="flex justify-between font-bold text-lg mb-6">

                      <span>
                        Total:
                      </span>

                      <span className="text-rose-600">
                        R$ {cartTotal.toFixed(2).replace('.', ',')}
                      </span>

                    </div>


                    <button
                      onClick={() => {

                        setIsCartOpen(false);

                        alert(
                          'Pedido de demonstração simulado com sucesso! (Nenhum valor real foi cobrado).'
                        );

                        setCart([]);

                      }}
                      className="w-full bg-gray-900 hover:bg-black text-white py-4 rounded-xl font-bold transition-colors"
                    >
                      Finalizar Compra (Simulação)
                    </button>

                  </div>

                )}

              </div>

            </div>

          )}

        </div>

      );

    }


    /* =========================================================
       INICIALIZAÇÃO
    ========================================================= */

    const root = ReactDOM.createRoot(
      document.getElementById('root')
    );

    root.render(<App />);

  </script>

</body>
  </html>

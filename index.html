    ];

    function App() {
      const [currentPath, setCurrentPath] = useState('/');
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      const navigate = (path) => {
        setCurrentPath(path);
        setMobileMenuOpen(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const addToCart = (product) => {
        setCart(prev => {
          const exists = prev.find(item => item.id === product.id);
          if (exists) {
            return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
          }
          return [...prev, { ...product, quantity: 1 }];
        });
        setIsCartOpen(true);
      };

      const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

      const whatsappUrl = `https://wa.me/${DEMO_CONFIG.whatsappNumber}?text=${encodeURIComponent(DEMO_CONFIG.whatsappMessage)}`;

            {/* PÁGINA: CONTATO */}
            {currentPath === '/contato' && (
              <div className="py-12 max-w-4xl mx-auto px-4 space-y-8">
                <div className="text-center space-y-2">
                  <h1 className="font-serif text-4xl font-bold">Entre em Contato</h1>
                  <p className="text-gray-600">Tire suas dúvidas ou faça seu pedido personalizado diretamente conosco</p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                  
                  {/* CANAIS DE CONTATO */}
                  <div className="space-y-4">
                    <a href={whatsappUrl} target="_blank" rel="noopener noreferrer" className="block p-6 bg-emerald-50 rounded-2xl border border-emerald-100 text-emerald-800 hover:bg-emerald-100 transition">
                      <h3 className="font-bold mb-1">WhatsApp Demo</h3>
                      <p className="text-xs text-emerald-600">Atendimento rápido por mensagem</p>
                      <span className="text-sm font-semibold mt-2 inline-block">Clique para abrir &rarr;</span>
                    </a>

                    <a href={DEMO_CONFIG.instagramUrl} target="_blank" rel="noopener noreferrer" className="block p-6 bg-rose-50 rounded-2xl border border-rose-100 text-rose-800 hover:bg-rose-100 transition">
                      <h3 className="font-bold mb-1">Instagram Demo</h3>
                      <p className="text-xs text-rose-600">Siga nossas novidades no perfil</p>
                      <span className="text-sm font-semibold mt-2 inline-block">@amor_em_par_demo &rarr;</span>
                    </a>
                  </div>

                  {/* FORMULÁRIO */}
                  <div className="md:col-span-2 bg-white p-8 rounded-2xl border border-gray-100 shadow-sm space-y-4">
                    <div>
                      <label className="block text-xs font-bold uppercase text-gray-600 mb-1">Seu Nome</label>
                      <input type="text" className="w-full border rounded-lg p-3 outline-none focus:ring-2 focus:ring-rose-500" placeholder="Ex: Maria Silva" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-gray-600 mb-1">Seu E-mail</label>
                      <input type="email" className="w-full border rounded-lg p-3 outline-none focus:ring-2 focus:ring-rose-500" placeholder="maria@email.com" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-gray-600 mb-1">Mensagem</label>
                      <textarea rows="4" className="w-full border rounded-lg p-3 outline-none focus:ring-2 focus:ring-rose-500" placeholder="Como podemos te ajudar?"></textarea>
                    </div>
                    <button onClick={() => alert('Mensagem enviada com sucesso! (Simulação de demonstração)')} className="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 rounded-xl transition">
                      Enviar Mensagem
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* FOOTER */}
          <footer className="bg-gray-900 text-gray-300 py-12 border-t border-gray-800">
            <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8 mb-8 text-center md:text-left">
              <div>
                <span className="font-serif text-2xl font-bold text-white">Amor<span className="text-rose-500">emPar</span></span>
                <p className="text-sm text-gray-400 mt-2">Projeto conceitual desenvolvido para demonstração de portfólio.</p>
              </div>
              <div>
                <h4 className="font-bold text-white mb-3">Links Rápidos</h4>
                <div className="flex flex-col space-y-2 text-sm">
                  <button onClick={() => navigate('/')} className="hover:text-rose-400 text-left">Início</button>
                  <button onClick={() => navigate('/sobre')} className="hover:text-rose-400 text-left">Sobre Nós</button>
                  <button onClick={() => navigate('/servicos')} className="hover:text-rose-400 text-left">Coleção</button>
                  <button onClick={() => navigate('/contato')} className="hover:text-rose-400 text-left">Contato</button>
                </div>
              </div>
              <div>
                <h4 className="font-bold text-white mb-3">Redes Sociais (Demo)</h4>
                <div className="flex justify-center md:justify-start space-x-4">
                  <a href={whatsappUrl} target="_blank" rel="noopener noreferrer" className="hover:text-emerald-400 text-sm font-semibold">WhatsApp</a>
                  <span>•</span>
                  <a href={DEMO_CONFIG.instagramUrl} target="_blank" rel="noopener noreferrer" className="hover:text-rose-400 text-sm font-semibold">Instagram</a>
                </div>
              </div>
            </div>
            <div className="text-center pt-8 border-t border-gray-800 text-xs text-gray-500">
              &copy; 2026 Amor em Par - Todos os direitos reservados. Site de demonstração para portfólio.
            </div>
          </footer>

          {/* MODAL CARRINHO */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/50 backdrop-blur-xs">
              <div className="w-full max-w-md bg-white h-full p-6 flex flex-col justify-between shadow-2xl">
                <div>
                  <div className="flex justify-between items-center mb-6 pb-4 border-b">
                    <h3 className="font-serif text-xl font-bold">Seu Carrinho</h3>
                    <button onClick={() => setIsCartOpen(false)} className="text-gray-500 hover:text-black font-bold text-xl">✕</button>
                  </div>
                  {cart.length === 0 ? (
                    <p className="text-gray-500 text-center py-10">Seu carrinho está vazio.</p>
                  ) : (
                    <div className="space-y-4 max-h-[60vh] overflow-y-auto">
                      {cart.map(item => (
                        <div key={item.id} className="flex items-center justify-between border-b pb-3">
                          <div>
                            <h4 className="font-bold text-sm text-gray-900">{item.title}</h4>
                            <span className="text-xs text-gray-500">Qtd: {item.quantity}</span>
                          </div>
                          <span className="font-bold text-rose-600">R$ {(item.price * item.quantity).toFixed(2)}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                {cart.length > 0 && (
                  <div className="space-y-4 pt-4 border-t">
                    <div className="flex justify-between font-bold text-lg">
                      <span>Total:</span>
                      <span className="text-rose-600">R$ {cartTotal.toFixed(2)}</span>
                    </div>
                    <button onClick={() => { setIsCartOpen(false); alert('Pedido de demonstração simulado com sucesso!'); setCart([]); }} className="w-full bg-gray-900 hover:bg-black text-white py-3.5 rounded-xl font-bold transition">
                      Finalizar Compra (Simulação)
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
